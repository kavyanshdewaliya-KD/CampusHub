<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusHub · CSE-B</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C4CE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="1"] {
    --bg:#F4F2FC; --panel:#ffffff; --ink:#241645; --primary:#6C4CE0; --primary-ink:#ffffff;
    --accent2:#FFB65C; --pink:#FF6FA5; --danger:#FF5A5F; --good:#22B07D; --border:#241645; --chip:#E7E1FF;
    --lab-bg:#FFE5D9; --lab-border:#FF9E7D;
  }
  :root[data-theme="2"] {
    --bg:#FFF9F0; --panel:#ffffff; --ink:#1F1924; --primary:#FF6B6B; --primary-ink:#ffffff;
    --accent2:#4ECDC4; --pink:#FFE66D; --danger:#FF5A5F; --good:#10B981; --border:#1F1924; --chip:#F7FFF7;
    --lab-bg:#FFE3E3; --lab-border:#FF6B6B;
  }
  :root[data-theme="3"] {
    --bg:#E8F4F8; --panel:#ffffff; --ink:#0F172A; --primary:#0284C7; --primary-ink:#ffffff;
    --accent2:#38BDF8; --pink:#F472B6; --danger:#EF4444; --good:#10B981; --border:#0F172A; --chip:#E0F2FE;
    --lab-bg:#FEF3C7; --lab-border:#F59E0B;
  }

  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Poppins',sans-serif; min-height:100vh; transition:background 0.2s;}
  h1,h2,h3{font-family:'Baloo 2','Fredoka',sans-serif; font-weight:700; margin-top:8px; margin-bottom:6px;}
  button{font-family:'Poppins',sans-serif; cursor:pointer;} .hidden{display:none !important;}

  #login-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--panel); border:3px solid var(--border); border-radius:20px; padding:22px; max-width:420px; width:100%; box-shadow:6px 6px 0 var(--border); margin-bottom:14px;}
  .btn-primary{width:100%; background:var(--primary); color:var(--primary-ink); border:3px solid var(--border); border-radius:12px; padding:13px; font-weight:700; font-size:15px; box-shadow:4px 4px 0 var(--border);}
  input,select,textarea{width:100%; padding:10px 12px; border:3px solid var(--border); border-radius:12px; font-size:14px; margin-bottom:10px; font-family:inherit;}
  
  header.topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--panel); border-bottom:3px solid var(--border); position:sticky; top:0; z-index:10;}
  main{padding:16px; max-width:760px; margin:0 auto; padding-bottom:90px;}
  
  .pill{background:var(--chip); border:2px solid var(--border); border-radius:999px; padding:3px 8px; font-size:10px; font-weight:700;}
  .icon-btn{background:#fff; border:2px solid var(--border); border-radius:10px; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; font-size:14px;}
  
  .section-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .add-btn{background:var(--accent2); border:2px solid var(--border); border-radius:10px; padding:7px 12px; font-weight:700; font-size:13px;}
  .del-btn{background:var(--danger); color:#fff; border:2px solid var(--border); border-radius:8px; padding:4px 8px; font-size:11px; font-weight:700;}

  .row{border:2px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--panel); font-size:13px; box-shadow:3px 3px 0 var(--border); display:flex; flex-direction:column; gap:4px;}
  .row.lab-row{background:var(--lab-bg); border-color:var(--border);}
  .row-subject-tag{display:inline-block; padding:3px 8px; border-radius:6px; font-weight:700; font-size:11px; border:1.5px solid var(--border); margin-right:6px;}

  .chat-log{background:#fff; border:2px solid var(--border); border-radius:12px; padding:12px; height:320px; overflow-y:auto; margin-bottom:10px;}
  .msg{margin-bottom:10px; font-size:13px;} .msg b{font-size:11px;}
  .chat-input-row{display:flex; gap:7px;}
  .chat-input-row input{flex:1; margin:0;}
  .send-btn{background:var(--primary); color:var(--primary-ink); border:2px solid var(--border); border-radius:10px; padding:0 16px; font-weight:700;}

  .members-container{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:600px){.members-container{grid-template-columns:1fr;}}

  /* Calendar Grid */
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
  .cal-day{background:#fff; border:2px solid var(--border); border-radius:8px; padding:6px 2px; text-align:center; font-size:11px; position:relative; cursor:pointer; user-select:none; min-height:50px; display:flex; flex-direction:column; justify-content:space-between;}
  .cal-day.mst-day{background:#FFD1D1; border-color:#D32F2F; font-weight:700;}
  .cal-day.hol-day{background:#FEF08A; border-color:#CA8A04; font-weight:700;}
  .cal-day.has-leave{background:#FFE3E3; border-color:var(--danger);}
  .cal-day.has-half{background:#FFF3D6; border-color:var(--accent2);}
  .cal-day.has-skip{background:#FFEBF2; border-color:var(--pink);}

  /* Attendance Progress Bars */
  .prog-container{background:#eee; border:2px solid var(--border); border-radius:999px; height:12px; overflow:hidden; width:100%; margin:6px 0;}
  .prog-fill{height:100%; width:0%; transition:width 0.3s;}
  .prog-good{background:var(--good);}
  .prog-mid{background:var(--accent2);}
  .prog-bad{background:var(--danger);}

  /* Compact Bottom Navigation */
  nav.tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:3px solid var(--border); display:flex; z-index:10; height:60px;}
  nav.tabbar button{flex:1; background:none; border:none; padding:4px 2px; font-size:10px; font-weight:700; opacity:.6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  nav.tabbar button .t-icon{font-size:18px;}
  nav.tabbar button.active{opacity:1; color:var(--primary); background:var(--chip); border-top:3px solid var(--primary);}
  
  footer.dev-footer{text-align:center; opacity:0.75; font-size:11px; margin-top:20px; font-weight:700;}
  
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal-body{background:#fff; border:3px solid var(--border); border-radius:16px; width:100%; max-width:600px; max-height:85vh; overflow-y:auto; padding:20px;}
  .edit-item-box{border:2px dashed var(--border); border-radius:10px; padding:10px; margin-bottom:10px; background:#FDFDFD;}
</style>
</head>
<body data-theme="1">

<!-- Settings, Theme & Admin Key Modal -->
<div id="settings-modal" class="modal-overlay hidden">

    <label style="font-size:12px; font-weight:700;">Select Theme:</label>

      <label style="font-size:12px; font-weight:700;">🔑 Admin / CR Access Key:</label>

</div>

<!-- Timetable Visual Editor Modal -->
<div id="tt-modal" class="modal-overlay hidden">
  <div class="modal-body">
    <div class="section-title">
      <h3 style="margin:0;">📝 Edit Timetable Schedule</h3>
      <button id="tt-modal-close" class="del-btn">✕ Close</button>
    </div>
    <label style="font-size:12px; font-weight:700;">Select Day:</label>

      <option value="Tue">Tuesday</option>
      <option value="Wed">Wednesday</option>
      <option value="Thu">Thursday</option>

    <button class="add-btn" id="tt-add-slot-btn" style="width:100%; margin-bottom:12px;">+ Add Class Slot</button>
    <button class="btn-primary" id="tt-save-cloud-btn">Save Changes to Cloud ☁️</button>
  </div>
</div>

function getSubjectColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const h = Math.abs(hash) % 360;
  return `hsl(${h}, 70%, 88%)`;
}

function getBadgeClass(pct){
  if(pct >= 75) return 'prog-good';
  if(pct >= 65) return 'prog-mid';
  return 'prog-bad';
}

/* ---------- AUTH & BOOT ---------- */
document.getElementById('google-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(err => document.getElementById('login-status').textContent = 'Sign-in failed: '+err.message);

onAuthStateChanged(auth, (u)=>{
  user = u;
  if(u){
    syncMemberDoc();
    boot();
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }
});

async function syncMemberDoc(){
  if(!user) return;
  try {
    await setDoc(doc(db, 'classes', classCode, 'members', user.uid), {
      name: user.displayName, email: user.email, role: profile.role,
      isAdmin: profile.isAdmin, photoURL: user.photoURL,
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(e){ console.warn(e); }
}

document.getElementById('settings-btn').onclick = ()=> document.getElementById('settings-modal').classList.remove('hidden');
document.getElementById('settings-close').onclick = ()=> document.getElementById('settings-modal').classList.add('hidden');
document.getElementById('members-top-btn').onclick = ()=> showTab('members');

document.getElementById('theme-select').value = activeTheme;
document.getElementById('theme-select').onchange = (e)=>{
  activeTheme = e.target.value;
  document.body.setAttribute('data-theme', activeTheme);
  localStorage.setItem('ch_theme', activeTheme);
};

document.getElementById('unlock-submit-btn').onclick = ()=>{
  const k = document.getElementById('admin-unlock-key').value.trim();
  if(k === "IETKDPROJECT1"){
    profile.isAdmin = true; profile.role = "CR / Admin";
    localStorage.setItem('ch_profile', JSON.stringify(profile));
    syncMemberDoc();
    document.getElementById('settings-modal').classList.add('hidden');
    boot();
    alert("CR / Admin privileges unlocked!");
  } else if(k === "STUDENT") {
    profile.isAdmin = false; profile.role = "Student";
    localStorage.setItem('ch_profile', JSON.stringify(profile));
    syncMemberDoc();
    document.getElementById('settings-modal').classList.add('hidden');
    boot();
    alert("Switched to Student mode!");
  } else {
    alert("Incorrect key!");
  }
};

function boot(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('hdr-name').textContent = user.displayName;
  document.getElementById('hdr-sub').textContent = `${profile.role} · CSE-B`;
  
  setupPresence();
  loadTimetable();
  loadAttendance();
  loadCalendar();
  loadAssignments();
  loadAnnouncements();
  loadChat();
  loadMembers();
  showTab('timetable');
}

document.querySelectorAll('nav.tabbar button').forEach(b=> b.onclick = ()=> showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  ['timetable','attendance','calendar','assignments','announce','chat','members'].forEach(s=> document.getElementById('tab-'+s).classList.toggle('hidden', s!==t));
}

function setupPresence(){
  const myStatusRef = ref(rtdb, `presence/${classCode}/${user.uid}`);
  const connectedRef = ref(rtdb, '.info/connected');
  onValue(connectedRef, (snap)=>{
    if(snap.val()===false) return;
    onDisconnect(myStatusRef).set({ name:user.displayName, state:'offline', last_changed: rtdbServerTs() })
      .then(()=> rtdbSet(myStatusRef, { name:user.displayName, state:'online', last_changed: rtdbServerTs() }));
  });
}

/* ---------- TIMETABLE MODULE ---------- */
function loadTimetable(){
  const el = document.getElementById('tab-timetable');
  const ref_ = doc(db, 'classes', classCode, 'meta', 'timetable');
  onSnapshot(ref_, (snap)=>{
    currentTimetableData = snap.exists() ? snap.data().days : defaultTimetable;
    el.innerHTML = `<div class="section-title"><h2>🗓️ Schedule (M-309)</h2>${profile.isAdmin? '<button class="add-btn" id="tt-open-editor-btn">✏️ Edit</button>':''}</div>`;
    ['Mon','Tue','Wed','Thu','Fri'].forEach(d=>{
      const periods = (currentTimetableData && currentTimetableData[d]) || [];
      el.innerHTML += `<h3>${d}</h3>` + (periods.length? periods.map(p=>{
        const chipColor = getSubjectColor(p.subject);
        return `<div class="row ${p.isLab ? 'lab-row' : ''}">
          <span class="row-subject-tag" style="background:${chipColor};">${p.subject}</span>
          <b>${p.time}</b>
          <div style="font-size:11px; opacity:.8;">Faculty: ${p.teacher||'N/A'} | Venue: ${p.room||'M-309'}</div>
        </div>`;
      }).join('') : `<div style="font-size:12px; opacity:0.6;">No classes scheduled.</div>`);
    });
    
    if(profile.isAdmin && document.getElementById('tt-open-editor-btn')){
      document.getElementById('tt-open-editor-btn').onclick = openTimetableEditor;
    }
  });
}

function openTimetableEditor(){
  document.getElementById('tt-modal').classList.remove('hidden');
  renderEditorDayList();
}

document.getElementById('tt-modal-close').onclick = ()=> document.getElementById('tt-modal').classList.add('hidden');
document.getElementById('tt-edit-day').onchange = renderEditorDayList;

function renderEditorDayList(){
  const selDay = document.getElementById('tt-edit-day').value;
  const list = document.getElementById('tt-editor-list');
  const items = currentTimetableData[selDay] || [];
  list.innerHTML = '';
  
  items.forEach((item, idx)=>{
    list.innerHTML += `
      <div class="edit-item-box" data-idx="${idx}">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <b>Slot #${idx+1}</b>
          <button class="del-btn btn-remove-slot">Remove</button>
        </div>
        <input class="inp-time" value="${item.time||''}" placeholder="Time (09:00 - 10:00)">
        <input class="inp-subject" value="${item.subject||''}" placeholder="Subject Name">
        <input class="inp-teacher" value="${item.teacher||''}" placeholder="Teacher Code">

/* ---------- ATTENDANCE & PERCENTAGE ENGINE ---------- */
function loadAttendance(){
  const el = document.getElementById('tab-attendance');
  const todayStr = new Date().toISOString().split('T')[0];
  
  el.innerHTML = `
    <div class="section-title"><h2>📋 Attendance</h2></div>
    <div class="card" style="max-width:100%;">
      <label style="font-size:12px; font-weight:700;">Select Date:</label>
      <input type="date" id="att-date" min="2026-08-05" max="2026-12-15" value="${todayStr}">
      <div id="att-classes-container" style="margin-top:12px;"></div>
    </div>
    <div class="card" style="max-width:100%;">
      <h3>📊 Subject-wise Attendance (%)</h3>
      <p style="font-size:11px; opacity:.7; margin-bottom:10px;">Calculated from semester start (Aug 5, 2026).</p>
      <div id="att-stats-container"></div>
    </div>`;

  const dateInp = document.getElementById('att-date');
  dateInp.onchange = renderDayAttendanceForm;
  renderDayAttendanceForm();
  renderAttendanceStats();
}

async function renderDayAttendanceForm(){
  const dateStr = document.getElementById('att-date').value;
  const container = document.getElementById('att-classes-container');
  
  if(fixedMSTDates[dateStr] || fixedHolidays[dateStr]){
    const label = fixedMSTDates[dateStr] || fixedHolidays[dateStr];
    container.innerHTML = `<div style="font-size:13px; color:var(--danger); font-weight:700; text-align:center; padding:10px;">Official Event: ${label} (No regular classes)</div>`;
    return;
  }

  const dObj = new Date(dateStr);
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayName = dayNames[dObj.getDay()];
  
  if(dayName === 'Sun' || dayName === 'Sat'){
    container.innerHTML = `<div style="font-size:13px; opacity:.7; text-align:center; padding:10px;">Weekend! No scheduled classes on ${dayName}.</div>`;
    return;
  }

  const planSnap = await doc(db, 'users', user.uid, 'calendar_plans', dateStr);
  onSnapshot(planSnap, async (pSnap)=>{
    const planType = pSnap.exists() ? pSnap.data().type : null;
    
    const ttSnap = await doc(db, 'classes', classCode, 'meta', 'timetable');
    onSnapshot(ttSnap, async (tSnap)=>{
      const tData = tSnap.exists() ? tSnap.data().days : defaultTimetable;
      const daySlots = (tData && tData[dayName]) || [];
      
      if(!daySlots.length){
        container.innerHTML = `<div style="font-size:12px; opacity:.6;">No periods listed for ${dayName}.</div>`;
        return;
      }

      const attCol = collection(db, 'users', user.uid, 'attendance_logs');
      onSnapshot(attCol, (logSnap)=>{
        const logs = {};
        logSnap.forEach(d => {
          if(d.id.startsWith(dateStr)) logs[d.id] = d.data().status;
        });

        let html = `<div style="font-size:12px; margin-bottom:8px; font-weight:700;">Classes for ${dayName} (${dateStr}): ${planType ? `<span style="color:var(--danger)">[Leave Status: ${planType.toUpperCase()}]</span>`:''}</div>`;
        
        daySlots.forEach((slot, idx)=>{
          const logKey = `${dateStr}_${idx}`;
          const currentStatus = logs[logKey] || (planType === 'leave' || planType === 'skip' ? 'Absent' : 'Present');
          const isChecked = currentStatus === 'Present';
          
          html += `
            <div class="row" style="flex-direction:row; justify-content:space-between; align-items:center; padding:8px 12px;">
              <div>
                <span class="row-subject-tag" style="background:${getSubjectColor(slot.subject)};">${slot.subject}</span>
                <div style="font-size:11px; opacity:.7;">${slot.time} · ${slot.room}</div>
              </div>
              <label style="font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer;">
                <span>${isChecked ? 'Present ✅' : 'Absent ❌'}</span>
                <input type="checkbox" class="att-checkbox" data-slotidx="${idx}" data-date="${dateStr}" ${isChecked ? 'checked' : ''} style="width:18px; height:18px; margin:0;">
              </label>
            </div>`;
        });

        container.innerHTML = html;

        container.querySelectorAll('.att-checkbox').forEach(chk => {
          chk.onchange = async (e) => {
            const sIdx = e.target.dataset.slotidx;
            const dStr = e.target.dataset.date;
            const status = e.target.checked ? 'Present' : 'Absent';
            await setDoc(doc(db, 'users', user.uid, 'attendance_logs', `${dStr}_${sIdx}`), {
              date: dStr, slotIdx: Number(sIdx), status, subject: daySlots[sIdx].subject, ts: serverTimestamp()
            });
            renderAttendanceStats();
          };
        });
      });
    });
  });
}

async function renderAttendanceStats(){
  const statsContainer = document.getElementById('att-stats-container');
  const startDate = new Date('2026-08-05');
  const today = new Date();
  
  const ttSnap = await doc(db, 'classes', classCode, 'meta', 'timetable');
  onSnapshot(ttSnap, async (tSnap)=>{
    const tData = tSnap.exists() ? tSnap.data().days : defaultTimetable;
    const totals = {};
    const attended = {};
    let curr = new Date(startDate);
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    
    const planSnap = collection(db, 'users', user.uid, 'calendar_plans');
    onSnapshot(planSnap, async (planSnapShot)=>{
      const plans = {};
      planSnapShot.forEach(d => plans[d.id] = d.data().type);
      
      const attLogSnap = collection(db, 'users', user.uid, 'attendance_logs');
      onSnapshot(attLogSnap, async (logSnap)=>{
        const logs = {};
        logSnap.forEach(d => logs[d.id] = d.data().status);

        curr = new Date(startDate);
        while(curr <= today){
          const dStr = curr.toISOString().split('T')[0];
          // Skip MST and College Holidays from standard class calculations
          if(!fixedMSTDates[dStr] && !fixedHolidays[dStr]){
            const dName = dayNames[curr.getDay()];
            const slots = tData[dName] || [];
            const plan = plans[dStr];
            
            slots.forEach((slot, idx)=>{
              const subj = slot.subject;
              totals[subj] = (totals[subj] || 0) + 1;
              
              const logKey = `${dStr}_${idx}`;
              let stat = logs[logKey];
              if(!stat){
                if(plan === 'leave' || plan === 'skip') stat = 'Absent';
                else stat = 'Present';
              }
              if(stat === 'Present'){
                attended[subj] = (attended[subj] || 0) + 1;
              }
            });
          }
          curr.setDate(curr.getDate() + 1);
        }

        let statsHtml = '';
        const subjects = Object.keys(totals);
        if(!subjects.length){
          statsContainer.innerHTML = `<div style="font-size:12px; opacity:.6;">No subjects found.</div>`;
          return;
        }

        subjects.forEach(subj => {
          const tot = totals[subj];
          const att = attended[subj] || 0;
          const pct = tot > 0 ? Math.round((att / tot) * 100) : 100;
          const badge = getBadgeClass(pct);
          
          statsHtml += `
            <div style="margin-bottom:10px; font-size:12px;">
              <div style="display:flex; justify-content:space-between; font-weight:700;">
                <span>${subj}</span>
                <span>${att} / ${tot} (${pct}%)</span>
              </div>
              <div class="prog-container"><div class="prog-fill ${badge}" style="width:${pct}%;"></div></div>
            </div>`;
        });

        statsContainer.innerHTML = statsHtml;
      });
    });
  });
}

/* ---------- CLICKABLE CALENDAR PLANNER (WITH FIXED MST & HOLIDAYS) ---------- */
function loadCalendar(){
  const el = document.getElementById('tab-calendar');
  el.innerHTML = `<div class="section-title"><h2>📅 Calendar Planner</h2></div>
    <div class="card" style="max-width:100%;">
      <p style="font-size:11px; opacity:.8; margin-bottom:8px;">
        <span style="background:#FFD1D1; padding:2px 6px; border:1px solid #D32F2F; border-radius:4px;">Red = MST Exams</span> 
        <span style="background:#FEF08A; padding:2px 6px; border:1px solid #CA8A04; border-radius:4px;">Yellow = College Holidays</span>
      </p>
      <label style="font-size:12px; font-weight:700;">Select Month:</label>
      <select id="cal-month-sel" style="margin-bottom:10px;">
        <option value="8">August 2026</option>
        <option value="9" selected>September 2026</option>
        <option value="10">October 2026</option>
        <option value="11">November 2026</option>
        <option value="12">December 2026</option>
      </select>
      <div class="cal-grid" id="cal-grid"></div>
    </div>`;
  
  const monthSel = document.getElementById('cal-month-sel');
  monthSel.onchange = renderCalendarGrid;
  renderCalendarGrid();
}

async function renderCalendarGrid(){
  const grid = document.getElementById('cal-grid');
  const month = document.getElementById('cal-month-sel').value;
  
  const daysInMonth = new Date(2026, month, 0).getDate();
  const planRef = collection(db, 'users', user.uid, 'calendar_plans');
  
  onSnapshot(planRef, (snap)=>{
    const plans = {};
    snap.forEach(d => plans[d.id] = d.data().type);
    grid.innerHTML = '';
    
    for(let i = 1; i <= daysInMonth; i++){
      const mStr = String(month).padStart(2,'0');
      const dStr = `2026-${mStr}-${String(i).padStart(2,'0')}`;
      
      const isMst = fixedMSTDates[dStr];
      const isHol = fixedHolidays[dStr];
      const planVal = plans[dStr];
      
      let cls = '';
      let badgeText = `${i}`;
      
      if(isMst){
        cls = 'mst-day';
        badgeText = `${i} (MST)`;
      } else if(isHol){
        cls = 'hol-day';
        badgeText = `${i} (Hol)`;
      } else if(planVal) {
        cls = `has-${planVal}`;
        badgeText = `${i} (${planVal.toUpperCase()})`;
      }
      
      grid.innerHTML += `
        <div class="cal-day ${cls}" data-date="${dStr}" data-fixed="${isMst || isHol ? 'yes':'no'}">
          <b>${i}</b>
          <span style="font-size:8.5px; opacity:.9;">${isMst ? 'MST' : (isHol ? 'Hol' : (planVal ? planVal.toUpperCase() : ''))}</span>
        </div>`;
    }
    
    grid.querySelectorAll('.cal-day').forEach(box => {
      box.onclick = async () => {
        if(box.dataset.fixed === 'yes'){
          alert("MST exams and official college holidays are fixed and unchangeable!");
          return;
        }
        const dStr = box.dataset.date;
        const curr = plans[dStr];
        let next = 'leave';
        if(curr === 'leave') next = 'half';
        else if(curr === 'half') next = 'skip';
        else if(curr === 'skip') next = null;
        
        if(next) {
          await setDoc(doc(db, 'users', user.uid, 'calendar_plans', dStr), { type: next });
        } else {
          await deleteDoc(doc(db, 'users', user.uid, 'calendar_plans', dStr));
        }
      };
    });
  });
}

/* ---------- CHAT MODULE ---------- */
function loadChat(){
  const el = document.getElementById('tab-chat');
  el.innerHTML = `
    <div class="section-title"><h2>💬 Chat</h2></div>
    <div style="display:flex; gap:6px; margin-bottom:10px;" id="chat-tabs-bar">
      <button class="add-btn" id="btn-chat-all" style="background:var(--primary); color:#fff;">🌐 Class</button>
      <button class="add-btn" id="btn-chat-priv" style="background:#fff;">🤫 Private Mode</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row"><input id="chat-in" placeholder="Message…"><button class="send-btn" id="chat-send">Send</button></div>`;
  
  const renderLog = () => {
    const qCol = activeChatTarget === 'ALL' 
      ? query(collection(db,'classes',classCode,'chat'), orderBy('ts','asc'), limit(200))
      : query(collection(db,'private_chats', [user.uid, activeChatTarget].sort().join('_'), 'messages'), orderBy('ts','asc'), limit(200));
    
    onSnapshot(qCol, (snap)=>{
      const log = document.getElementById('chat-log'); if(!log) return;
      log.innerHTML = '';
      snap.forEach(d=>{
        const m = d.data();
        log.innerHTML += `<div class="msg"><b>${m.role||'Student'} · ${m.name}</b><div>${m.text}</div></div>`;
      });
      log.scrollTop = log.scrollHeight;
    });
  };

  document.getElementById('btn-chat-all').onclick = ()=>{ activeChatTarget = 'ALL'; renderLog(); };
  document.getElementById('btn-chat-priv').onclick = ()=>{
    const targetUid = prompt("Enter Member User ID / Name to start 1:1 private chat:");
    if(targetUid) { activeChatTarget = targetUid; renderLog(); }
  };

  const sendMsg = async () => {
    const inp = document.getElementById('chat-in'); const text = inp.value.trim(); if(!text) return;
    if(activeChatTarget === 'ALL'){
      await addDoc(collection(db,'classes',classCode,'chat'), { text, name:user.displayName, uid:user.uid, role:profile.role, ts: serverTimestamp() });
    } else {
      const threadId = [user.uid, activeChatTarget].sort().join('_');
      await addDoc(collection(db,'private_chats', threadId, 'messages'), { text, name:user.displayName, uid:user.uid, role:profile.role, ts: serverTimestamp() });
    }
    inp.value='';
  };

  document.getElementById('chat-send').onclick = sendMsg;
  document.getElementById('chat-in').onkeydown = e => { if(e.key==='Enter') sendMsg(); };
  renderLog();
}

/* ---------- MEMBERS MODULE ---------- */
function loadMembers(){
  const el = document.getElementById('tab-members');
  const presenceRef = ref(rtdb, `presence/${classCode}`);
  onSnapshot(collection(db,'classes',classCode,'members'), (snap)=>{
    onValue(presenceRef, (pSnap)=>{
      const presence = pSnap.val() || {};
      const entries = [];
      snap.forEach(d=> entries.push({ uid:d.id, ...d.data() }));
      
      const active = entries.filter(e=> presence[e.uid]?.state==='online').sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      const offline = entries.filter(e=> presence[e.uid]?.state!=='online').sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      
      el.innerHTML = `<div class="section-title"><h2>👥 Members (${entries.length})</h2></div>
        <div class="members-container">
          <div>
            <div style="font-size:11px; opacity:.6; margin-bottom:6px; font-weight:700;">🟢 ACTIVE NOW (${active.length})</div>
            ${active.length ? active.map(e => `<div class="row" style="flex-direction:row; align-items:center; gap:6px;"><span style="color:var(--good)">●</span> <b>${e.name}</b> <span class="pill">${e.role||'Student'}</span> ${e.isAdmin?'🔑':''}</div>`).join('') : '<div style="font-size:12px; opacity:0.6;">No members online</div>'}
          </div>
          <div>
            <div style="font-size:11px; opacity:.6; margin-bottom:6px; font-weight:700;">⚪ ALL MEMBERS (${offline.length})</div>
            ${offline.length ? offline.map(e => `<div class="row" style="flex-direction:row; align-items:center; gap:6px;"><span style="color:#999">●</span> <b>${e.name}</b> <span class="pill">${e.role||'Student'}</span> ${e.isAdmin?'🔑':''}</div>`).join('') : '<div style="font-size:12px; opacity:0.6;">No offline members</div>'}
          </div>
        </div>`;
    });
  });
}
