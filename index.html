<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusHub · CSE-B</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6C4CE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --radius:16px; --border-w:3px; --font-display:'Baloo 2','Fredoka',sans-serif; --font-body:'Poppins',sans-serif;
    --bg:#F1EEFC; --panel:#fff; --ink:#241645; --primary:#6C4CE0; --primary-ink:#fff;
    --accent2:#FFB65C; --pink:#FF6FA5; --danger:#FF5A5F; --good:#22B07D; --border:#241645; --chip:#E7E1FF; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin-top:10px; margin-bottom:6px;}
  button{font-family:var(--font-body); cursor:pointer;} .hidden{display:none !important;}
  #login-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .card{background:var(--panel); border:var(--border-w) solid var(--border); border-radius:20px; padding:22px; max-width:420px; width:100%; box-shadow:6px 6px 0 var(--border); margin-bottom:14px;}
  .btn-primary{width:100%; background:var(--primary); color:var(--primary-ink); border:var(--border-w) solid var(--border); border-radius:12px; padding:13px; font-weight:700; font-size:15px; box-shadow:4px 4px 0 var(--border);}
  input,select,textarea{width:100%; padding:10px 12px; border:var(--border-w) solid var(--border); border-radius:12px; font-size:14px; margin-bottom:10px; font-family:inherit;}
  header.topbar{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; background:var(--panel); border-bottom:var(--border-w) solid var(--border); position:sticky; top:0; z-index:10;}
  main{padding:16px; max-width:720px; margin:0 auto; padding-bottom:90px;}
  .pill{background:var(--chip); border:2px solid var(--border); border-radius:999px; padding:4px 9px; font-size:10.5px; font-weight:700;}
  .icon-btn{background:#fff; border:2px solid var(--border); border-radius:10px; width:34px; height:34px;}
  .section-title{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .add-btn{background:var(--accent2); border:2px solid var(--border); border-radius:10px; padding:7px 12px; font-weight:700; font-size:13px;}
  .row{border:2px solid var(--border); border-radius:10px; padding:9px 11px; margin-bottom:8px; background:var(--chip); font-size:13px;}
  .lock-note{background:var(--chip); border:2px dashed var(--border); border-radius:10px; padding:9px 12px; font-size:12px; margin-bottom:10px;}
  .chat-log{background:#fff; border:2px solid var(--border); border-radius:12px; padding:10px; height:340px; overflow-y:auto; margin-bottom:10px;}
  .msg{margin-bottom:10px; font-size:13px;} .msg b{font-size:11px;}
  .chat-input-row{display:flex; gap:7px;}
  .chat-input-row input{flex:1; margin:0;}
  .send-btn{background:var(--primary); color:var(--primary-ink); border:2px solid var(--border); border-radius:10px; padding:0 14px; font-weight:700;}
  nav.tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:var(--border-w) solid var(--border); display:flex; z-index:10;}
  nav.tabbar button{flex:1; background:none; border:none; padding:9px 2px 8px; font-size:11px; font-weight:700; opacity:.5;}
  nav.tabbar button.active{opacity:1; color:var(--primary);}
  .empty{opacity:.5; font-size:13px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <h1 style="margin-top:0;">CampusHub ⚡🎓</h1>
    <p style="font-size:13px; opacity:.7;">Sign in with your Google account and enter your class key.</p>
    <button class="btn-primary" id="google-btn">Continue with Google</button>
    <p id="login-status" style="font-size:12px; opacity:.6; margin-top:10px; margin-bottom:0;"></p>
  </div>
  <div class="card hidden" id="join-card">
    <h2 style="font-size:18px; margin-top:0;">Join your class</h2>
    <input id="in-code" type="password" placeholder="Enter Access Key" style="text-transform:uppercase;">
    <select id="in-batch"><option value="B1">Batch 1</option><option value="B2">Batch 2</option></select>
    <button class="btn-primary" id="join-btn">Enter Classroom 🚀</button>
  </div>
</div>

<div id="app-screen" class="hidden">
  <header class="topbar">
    <div><b id="hdr-name"></b><div style="font-size:10.5px; opacity:.6;" id="hdr-sub"></div></div>
    <div style="display:flex; gap:6px; align-items:center;">
      <span class="pill" id="admin-pill" style="display:none;">🔑 CR / Admin</span>
      <button class="icon-btn" id="signout-btn" title="Sign out">🚪</button>
    </div>
  </header>
  <main>
    <section id="tab-timetable"></section>
    <section id="tab-assignments" class="hidden"></section>
    <section id="tab-announce" class="hidden"></section>
    <section id="tab-chat" class="hidden"></section>
    <section id="tab-members" class="hidden"></section>
  </main>
  <nav class="tabbar">
    <button data-tab="timetable">🗓️ Schedule</button>
    <button data-tab="assignments">📚 Tasks</button>
    <button data-tab="announce">📢 Announce</button>
    <button data-tab="chat">💬 Chat</button>
    <button data-tab="members">👥 Members</button>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getDatabase, ref, onValue, onDisconnect, set as rtdbSet, serverTimestamp as rtdbServerTs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBURkftN68dMpRFrnWBdca0qs1QmpQlzQ0",
  authDomain: "ietcse-bb0c9.firebaseapp.com",
  databaseURL: "https://ietcse-bb0c9-default-rtdb.firebaseio.com",
  projectId: "ietcse-bb0c9",
  storageBucket: "ietcse-bb0c9.firebasestorage.app",
  messagingSenderId: "39297300181",
  appId: "1:39297300181:web:08b6d3e5bae40b9c19145c",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

let user=null, classCode='CSE-B-2026', profile={role:'Student', batch:'B1', isAdmin:false};

const defaultTimetable = {
  "Mon": [
    {"time": "09:00 - 10:00", "subject": "Applied Chemistry", "teacher": "VF-SB", "room": "M-309"},
    {"time": "10:00 - 11:00", "subject": "Basic Electronics", "teacher": "VF-1SS", "room": "M-309"},
    {"time": "11:00 - 12:00", "subject": "Applied Math-I", "teacher": "VF-1SM", "room": "M-309"},
    {"time": "01:00 - 03:00", "subject": "LAB: Applied Chem (B2: A-206) / Basic Elec (B1: A-205)", "teacher": "VF-SA / VF-1SS", "room": "Lab A-205/A-206"},
    {"time": "03:00 - 04:00", "subject": "Applied Chemistry", "teacher": "VF-SB", "room": "M-309"}
  ],
  "Tue": [
    {"time": "09:00 - 10:00", "subject": "Applied Chemistry", "teacher": "VF-SB", "room": "M-309"},
    {"time": "10:00 - 12:00", "subject": "LAB: Basic Elec (B2: D-107) / Mech Engg (B1: D-107)", "teacher": "Faculty", "room": "Lab D-107"},
    {"time": "01:00 - 02:00", "subject": "Technical English", "teacher": "2AS", "room": "M-309"},
    {"time": "02:00 - 03:00", "subject": "Applied Math-I", "teacher": "VF-1SM", "room": "M-309"},
    {"time": "03:00 - 05:00", "subject": "LAB: Applied Chem (B1: A-206) / Mech Engg (B2: A-205)", "teacher": "VF-SA / VF-VS", "room": "Lab A-205/A-206"}
  ],
  "Wed": [
    {"time": "09:00 - 10:00", "subject": "Applied Math-I", "teacher": "VF-1SM", "room": "M-309"},
    {"time": "10:00 - 11:00", "subject": "Applied Math-I (Remedial)", "teacher": "VF-1SM", "room": "M-309"},
    {"time": "11:00 - 12:00", "subject": "Gen Mech Engg", "teacher": "1SK", "room": "M-309"},
    {"time": "01:00 - 03:00", "subject": "Workshop Practice (Batch B2)", "teacher": "4JS", "room": "Workshop"},
    {"time": "01:00 - 02:00", "subject": "Design Thinking (Batch B1)", "teacher": "VF-1VV", "room": "M-309"},
    {"time": "03:00 - 04:00", "subject": "Gen Mech Engg", "teacher": "4JS", "room": "M-309"}
  ],
  "Thu": [
    {"time": "09:00 - 10:00", "subject": "Technical English", "teacher": "2AS", "room": "M-309"},
    {"time": "10:00 - 11:00", "subject": "Technical English (Remedial)", "teacher": "2AS", "room": "M-309"},
    {"time": "11:00 - 12:00", "subject": "Technical English", "teacher": "2AS", "room": "M-309"},
    {"time": "01:00 - 02:00", "subject": "Applied Chemistry (Remedial)", "teacher": "VF-SB", "room": "M-309"},
    {"time": "02:00 - 03:00", "subject": "Basic Electronics", "teacher": "VF-1SS", "room": "M-309"}
  ],
  "Fri": [
    {"time": "09:00 - 10:00", "subject": "Applied Math-I", "teacher": "VF-1SM", "room": "M-309"},
    {"time": "09:00 - 11:00", "subject": "Workshop Practice (Batch B1)", "teacher": "4JS", "room": "Workshop"},
    {"time": "01:00 - 02:00", "subject": "Gen Mech Engg", "teacher": "1SK", "room": "M-309"},
    {"time": "02:00 - 03:00", "subject": "Basic Electronics", "teacher": "VF-1SS", "room": "M-309"},
    {"time": "03:00 - 04:00", "subject": "Basic Electronics (Remedial)", "teacher": "VF-1SS", "room": "M-309"},
    {"time": "04:00 - 05:00", "subject": "Gen Mech Engg (Remedial)", "teacher": "4JS", "room": "M-309"}
  ]
};

/* ---------- AUTH ---------- */
document.getElementById('google-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(err => document.getElementById('login-status').textContent = 'Sign-in failed: '+err.message);

onAuthStateChanged(auth, (u)=>{
  user = u;
  if(u){
    document.getElementById('login-status').textContent = `Signed in as ${u.displayName} (${u.email})`;
    document.getElementById('join-card').classList.remove('hidden');
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('join-card').classList.add('hidden');
  }
});

/* ---------- KEY VALIDATION ---------- */
document.getElementById('join-btn').onclick = async ()=>{
  const inputKey = document.getElementById('in-code').value.trim().toUpperCase();
  if(!inputKey || !user){
    alert("Please enter your key and sign in with Google first!");
    return;
  }

  if(inputKey === "IETKDPROJECT1") {
    profile.isAdmin = true;
    profile.role = "CR / Admin";
  } else if(inputKey === "IETCSEB") {
    profile.isAdmin = false;
    profile.role = "Student";
  } else {
    alert("Invalid Access Key!");
    return;
  }

  profile.batch = document.getElementById('in-batch').value;

  try {
    const memberRef = doc(db, 'classes', classCode, 'members', user.uid);
    await setDoc(memberRef, {
      name: user.displayName,
      email: user.email,
      role: profile.role,
      batch: profile.batch,
      isAdmin: profile.isAdmin,
      photoURL: user.photoURL,
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(e) {
    console.warn("Permission notice:", e.message);
  }

  boot();
};

document.getElementById('signout-btn').onclick = ()=> signOut(auth);

/* ---------- APP BOOT ---------- */
function boot(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('hdr-name').textContent = user.displayName;
  document.getElementById('hdr-sub').textContent = `${profile.role} · CSE-B · Batch ${profile.batch.slice(1)}`;
  document.getElementById('admin-pill').style.display = profile.isAdmin ? 'inline-block' : 'none';
  setupPresence();
  loadTimetable();
  loadAssignments();
  loadAnnouncements();
  loadChat();
  loadMembers();
  showTab('timetable');
}

document.querySelectorAll('nav.tabbar button').forEach(b=> b.onclick = ()=> showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  ['timetable','assignments','announce','chat','members'].forEach(s=> document.getElementById('tab-'+s).classList.toggle('hidden', s!==t));
}

/* ---------- PRESENCE ---------- */
function setupPresence(){
  const myStatusRef = ref(rtdb, `presence/${classCode}/${user.uid}`);
  const connectedRef = ref(rtdb, '.info/connected');
  onValue(connectedRef, (snap)=>{
    if(snap.val()===false) return;
    onDisconnect(myStatusRef).set({ name:user.displayName, state:'offline', last_changed: rtdbServerTs() })
      .then(()=> rtdbSet(myStatusRef, { name:user.displayName, state:'online', last_changed: rtdbServerTs() }));
  });
}

/* ---------- TIMETABLE MODULE ---------- */
async function loadTimetable(){
  const el = document.getElementById('tab-timetable');
  const ref_ = doc(db, 'classes', classCode, 'meta', 'timetable');
  onSnapshot(ref_, (snap)=>{
    const days = snap.exists() ? snap.data().days : defaultTimetable;
    el.innerHTML = `<div class="section-title"><h2>🗓️ Timetable (Room M-309)</h2>${profile.isAdmin? '<button class="add-btn" id="tt-edit-btn">Edit Schedule</button>':''}</div>`;
    if(!profile.isAdmin) el.innerHTML += `<div class="lock-note">🔒 Official IET DAVV Timetable loaded. Contact CR for updates.</div>`;
    const dayNames = ['Mon','Tue','Wed','Thu','Fri'];
    dayNames.forEach(d=>{
      const periods = (days && days[d]) || [];
      el.innerHTML += `<h3>${d}</h3>` + (periods.length? periods.map(p=>`<div class="row"><b>${p.time}</b> — ${p.subject} <div style="font-size:11px;opacity:.7;">Faculty: ${p.teacher||'N/A'} | Venue: ${p.room||'M-309'}</div></div>`).join('') : `<div class="empty">No classes scheduled.</div>`);
    });
    if(profile.isAdmin){
      const btn = document.getElementById('tt-edit-btn');
      if(btn) btn.onclick = async ()=>{
        const current = JSON.stringify(days||{}, null, 2);
        const next = prompt('Edit timetable JSON:', current);
        if(next==null) return;
        try{ const parsed = JSON.parse(next); await setDoc(ref_, { days: parsed }); }
        catch(e){ alert('Invalid JSON: '+e.message); }
      };
    }
  });
}

/* ---------- ASSIGNMENTS MODULE ---------- */
function loadAssignments(){
  const el = document.getElementById('tab-assignments');
  const q = query(collection(db,'classes',classCode,'assignments'), orderBy('ts','desc'), limit(50));
  onSnapshot(q, (snap)=>{
    el.innerHTML = `<div class="section-title"><h2>📚 Assignments & Tasks</h2></div>`;
    if(profile.isAdmin){
      el.innerHTML += `
        <div style="background:#fff; border:2px solid var(--border); border-radius:12px; padding:12px; margin-bottom:14px;">
          <input id="asg-title" placeholder="Assignment Title (e.g. Applied Math Assignment 1)" style="margin-bottom:6px;">
          <input id="asg-link" placeholder="Submission Link (Google Drive / Form URL)" style="margin-bottom:6px;">
          <textarea id="asg-desc" placeholder="Instructions, requirements, and due date..." rows="2" style="margin-bottom:6px;"></textarea>
          <button class="add-btn" id="asg-post-btn" style="width:100%;">Post Assignment 🚀</button>
        </div>`;
    }
    if(snap.empty) el.innerHTML += `<div class="empty">No active assignments posted.</div>`;
    snap.forEach(d=>{
      const a = d.data();
      el.innerHTML += `
        <div class="row" style="background:#fff;">
          <b>${a.title}</b> <span style="font-size:11px; opacity:.6;">by ${a.byName}</span>
          <div style="margin:4px 0;">${a.desc}</div>
          ${a.link ? `<a href="${a.link}" target="_blank" style="font-weight:700; color:var(--primary);">🔗 Open Submission Link</a>` : ''}
        </div>`;
    });
    const postBtn = document.getElementById('asg-post-btn');
    if(postBtn) postBtn.onclick = async ()=>{
      const title = document.getElementById('asg-title').value.trim();
      const link = document.getElementById('asg-link').value.trim();
      const desc = document.getElementById('asg-desc').value.trim();
      if(!title) return alert('Please enter an assignment title!');
      await addDoc(collection(db,'classes',classCode,'assignments'), {
        title, link, desc, byName: user.displayName, ts: serverTimestamp()
      });
      document.getElementById('asg-title').value = '';
      document.getElementById('asg-link').value = '';
      document.getElementById('asg-desc').value = '';
    };
  });
}

/* ---------- ANNOUNCEMENTS ---------- */
function loadAnnouncements(){
  const el = document.getElementById('tab-announce');
  const q = query(collection(db,'classes',classCode,'announcements'), orderBy('ts','desc'), limit(50));
  onSnapshot(q, (snap)=>{
    el.innerHTML = `<div class="section-title"><h2>📢 Announcements</h2></div>`;
    if(profile.isAdmin){
      el.innerHTML += `<div style="display:flex; gap:7px; margin-bottom:12px;"><input id="ann-in" placeholder="Write an announcement…" style="margin:0;"><button class="send-btn" id="ann-send">Post</button></div>`;
    }
    if(snap.empty) el.innerHTML += `<div class="empty">No announcements yet.</div>`;
    snap.forEach(d=>{
      const a = d.data();
      el.innerHTML += `<div class="row"><b>${a.byName||'CR'}</b> · ${a.ts? new Date(a.ts.toDate()).toLocaleString() : ''}<div>${a.text}</div></div>`;
    });
    const sendBtn = document.getElementById('ann-send');
    if(sendBtn) sendBtn.onclick = async ()=>{
      const val = document.getElementById('ann-in').value.trim(); if(!val) return;
      await addDoc(collection(db,'classes',classCode,'announcements'), { text: val, byName: user.displayName, byUid: user.uid, ts: serverTimestamp() });
      document.getElementById('ann-in').value='';
    };
  });
}

/* ---------- CHAT ---------- */
function loadChat(){
  const el = document.getElementById('tab-chat');
  el.innerHTML = `<div class="section-title"><h2>💬 Class Chat</h2></div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row"><input id="chat-in" placeholder="Message everyone…"><button class="send-btn" id="chat-send">Send</button></div>`;
  const q = query(collection(db,'classes',classCode,'chat'), orderBy('ts','asc'), limit(200));
  onSnapshot(q, (snap)=>{
    const log = document.getElementById('chat-log'); if(!log) return;
    log.innerHTML = '';
    snap.forEach(d=>{
      const m = d.data();
      log.innerHTML += `<div class="msg"><b>${m.role||'Student'} · ${m.name}</b><div>${m.text}</div></div>`;
    });
    log.scrollTop = log.scrollHeight;
  });
  document.getElementById('chat-send').onclick = sendMsg;
  document.getElementById('chat-in').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });
  async function sendMsg(){
    const inp = document.getElementById('chat-in'); const text = inp.value.trim(); if(!text) return;
    await addDoc(collection(db,'classes',classCode,'chat'), { text, name:user.displayName, uid:user.uid, role:profile.role, ts: serverTimestamp() });
    inp.value='';
  }
}

/* ---------- MEMBERS & ACTIVE TRACKER ---------- */
function loadMembers(){
  const el = document.getElementById('tab-members');
  const presenceRef = ref(rtdb, `presence/${classCode}`);
  onSnapshot(collection(db,'classes',classCode,'members'), (snap)=>{
    onValue(presenceRef, (pSnap)=>{
      const presence = pSnap.val() || {};
      const entries = [];
      snap.forEach(d=> entries.push({ uid:d.id, ...d.data() }));
      entries.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
      const active = entries.filter(e=> presence[e.uid]?.state==='online');
      const inactive = entries.filter(e=> presence[e.uid]?.state!=='online');
      el.innerHTML = `<div class="section-title"><h2>👥 Members (${entries.length})</h2></div>`;
      const row = e => `<div class="row"><span style="color:${presence[e.uid]?.state==='online'?'var(--good)':'#999'}">●</span> <b>${e.name}</b> — ${e.role||'Student'} · Batch ${String(e.batch||'').slice(1)} ${e.isAdmin?'🔑':''}</div>`;
      if(active.length) el.innerHTML += `<div style="font-size:11px;opacity:.5;margin:8px 0 4px;">ACTIVE NOW</div>` + active.map(row).join('');
      if(inactive.length) el.innerHTML += `<div style="font-size:11px;opacity:.5;margin:8px 0 4px;">NOT ACTIVE</div>` + inactive.map(row).join('');
    });
  });
}
</script>
</body>
</html>
