<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Hub - M-309</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              sunset: { bg: '#fff7ed', card: '#ffedd5', border: '#fed7aa', text: '#9a3412' }
            }
          }
        }
      }
    </script>
    <!-- React & Babel CDNs for single-file deployment -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white text-gray-800 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Role & Auth State
            const [role, setRole] = React.useState('CR / Admin');
            const [passcode, setPasscode] = React.useState('');
            const [showSettings, setShowSettings] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('sch');

            // Access Keys
            const ADMIN_KEY = 'IETKDPROJECT1';
            const STUDENT_KEY = 'IETCSEB';

            // Tasks State with color support
            const [tasks, setTasks] = React.useState([
                { id: 1, title: 'MECHENICAL FILE', type: 'Assignment', link: '#', color: 'bg-green-100 text-green-800 border-green-300', author: 'Kavyansh Dewaliya', details: 'COMPLETE SOON' }
            ]);
            const [newTaskTitle, setNewTaskTitle] = React.useState('');
            const [newTaskLink, setNewTaskLink] = React.useState('');
            const [newTaskDetails, setNewTaskDetails] = React.useState('');
            const [newTaskColor, setNewTaskColor] = React.useState('bg-green-100 text-green-800 border-green-300');

            // Resources State (Subject-wise subparts)
            const [selectedSubject, setSelectedSubject] = React.useState('Applied Chemistry');
            const [resources, setResources] = React.useState([
                { id: 1, title: 'Roll List 2026-27', type: 'Roll List', subject: 'General', link: '#' },
                { id: 2, title: 'Reaction Mechanisms Notes', type: 'Notes', subject: 'Applied Chemistry', link: '#' }
            ]);
            const [newResTitle, setNewResTitle] = React.useState('');
            const [newResType, setNewResType] = React.useState('Notes');
            const [newResLink, setNewResLink] = React.useState('');

            // Chat State (Admin-only delete/revoke)
            const [messages, setMessages] = React.useState([
                { id: 1, user: 'Kavyansh Dewaliya', text: 'Welcome to the updated Campus Hub chat!', role: 'CR / Admin' }
            ]);
            const [newMsg, setNewMsg] = React.useState('');

            const subjects = ['Applied Chemistry', 'Basic Electronics', 'Applied Math-I', 'Mechanical Engineering', 'General'];

            const handleRoleUpdate = (e) => {
                e.preventDefault();
                if (passcode.trim() === ADMIN_KEY) {
                    setRole('CR / Admin');
                    setShowSettings(false);
                    setPasscode('');
                    alert('Switched to Admin Role successfully!');
                } else if (passcode.trim() === STUDENT_KEY) {
                    setRole('Student');
                    setShowSettings(false);
                    setPasscode('');
                    alert('Switched to Student Role successfully!');
                } else {
                    alert('Incorrect key! Use valid admin or student passcode.');
                }
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if(!newTaskTitle) return;
                setTasks([...tasks, {
                    id: Date.now(),
                    title: newTaskTitle,
                    link: newTaskLink || '#',
                    details: newTaskDetails || 'No details provided',
                    color: newTaskColor,
                    author: role === 'CR / Admin' ? 'Kavyansh Dewaliya' : 'Student User'
                }]);
                setNewTaskTitle('');
                setNewTaskLink('');
                setNewTaskDetails('');
            };

            const handleAddResource = (e) => {
                e.preventDefault();
                if(!newResTitle) return;
                setResources([...resources, {
                    id: Date.now(),
                    title: newResTitle,
                    type: newResType,
                    subject: selectedSubject,
                    link: newResLink || '#'
                }]);
                setNewResTitle('');
                setNewResLink('');
            };

            const handleSendChat = (e) => {
                e.preventDefault();
                if(!newMsg.trim()) return;
                setMessages([...messages, { id: Date.now(), user: 'Kavyansh Dewaliya', text: newMsg, role }]);
                setNewMsg('');
            };

            const deleteMessage = (id) => {
                if (role !== 'CR / Admin') {
                    alert('Access denied. Only Admins can revoke/delete chat messages.');
                    return;
                }
                setMessages(messages.filter(m => m.id !== id));
            };

            return (
                <div className="min-h-screen pb-20 border border-gray-200">
                    {/* Header */}
                    <header className="p-4 border-b flex justify-between items-center bg-white shadow-sm">
                        <div>
                            <h1 className="font-bold text-lg">Kavyansh Dewaliya</h1>
                            <p className="text-xs text-gray-500">{role} / CSE-B</p>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 border rounded-full hover:bg-gray-100">
                            ⚙️
                        </button>
                    </header>

                    {/* Settings / Role Modal Overlay */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/50 flex justify-center items-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full shadow-xl relative border border-gray-200">
                                <button onClick={() => setShowSettings(false)} className="absolute top-3 right-3 text-gray-400 hover:text-black">✕</button>
                                <h2 className="font-bold text-lg mb-4">🔑 App Settings & Role Switch</h2>
                                <form onSubmit={handleRoleUpdate} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-gray-500 mb-1">Enter Access Key:</label>
                                        <input 
                                            type="password" 
                                            value={passcode} 
                                            onChange={(e) => setPasscode(e.target.value)} 
                                            placeholder="Enter passcode..."
                                            className="w-full p-2 border rounded-md"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-black text-white p-2 rounded-md font-medium">Verify & Update Role</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="max-w-4xl mx-auto p-4">
                        {activeTab === 'sch' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">📅 Schedule (M-309)</h2>
                                <div className="space-y-3">
                                    <div className="p-3 rounded-lg border bg-green-50 border-green-200">
                                        <div className="font-bold text-green-900">Applied Chemistry</div>
                                        <div className="text-sm text-green-700">09:00 - 10:00 | Faculty: VF-SB | Venue: M-309</div>
                                    </div>
                                    <div className="p-3 rounded-lg border bg-red-50 border-red-200">
                                        <div className="font-bold text-red-900">Basic Electronics</div>
                                        <div className="text-sm text-red-700">10:00 - 11:00 | Faculty: VF-1SS | Venue: M-309</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'tasks' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">📚 Tasks & Assignments</h2>
                                
                                {role === 'CR / Admin' && (
                                    <form onSubmit={handleAddTask} className="bg-gray-50 p-4 rounded-xl border mb-6">
                                        <h3 className="font-semibold mb-3 text-sm">👑 CR / Admin Upload Portal</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                            <input type="text" placeholder="Assignment Title" value={newTaskTitle} onChange={(e) => setNewTaskTitle(e.target.value)} className="p-2 border rounded" required />
                                            <input type="text" placeholder="Optional Drive/File Link" value={newTaskLink} onChange={(e) => setNewTaskLink(e.target.value)} className="p-2 border rounded" />
                                        </div>
                                        <textarea placeholder="Details and instructions..." value={newTaskDetails} onChange={(e) => setNewTaskDetails(e.target.value)} className="w-full p-2 border rounded mb-3"></textarea>
                                        
                                        <div className="mb-3">
                                            <label className="block text-xs font-semibold uppercase text-gray-500 mb-1">Select Card Color:</label>
                                            <select value={newTaskColor} onChange={(e) => setNewTaskColor(e.target.value)} className="w-full p-2 border rounded">
                                                <option value="bg-green-100 text-green-800 border-green-300">Green</option>
                                                <option value="bg-blue-100 text-blue-800 border-blue-300">Blue</option>
                                                <option value="bg-yellow-100 text-yellow-800 border-yellow-300">Yellow</option>
                                                <option value="bg-orange-100 text-orange-800 border-orange-300">Peach / Orange</option>
                                                <option value="bg-red-100 text-red-800 border-red-300">Red</option>
                                                <option value="bg-pink-100 text-pink-800 border-pink-300">Pink</option>
                                            </select>
                                        </div>
                                        <button type="submit" className="bg-black text-white px-4 py-2 rounded text-sm font-medium">Publish Assignment</button>
                                    </form>
                                )}

                                <div className="space-y-3">
                                    {tasks.map((task) => (
                                        <div key={task.id} className={`p-4 rounded-xl border ${task.color} shadow-sm`}>
                                            <div className="flex justify-between items-start">
                                                <span className="font-bold uppercase tracking-wider text-xs px-2 py-0.5 rounded bg-white/60">Assignment</span>
                                                <span className="text-xs opacity-75">by {task.author}</span>
                                            </div>
                                            <h3 className="text-lg font-bold mt-2">{task.title}</h3>
                                            <p className="text-sm mt-1">{task.details}</p>
                                            <a href={task.link} target="_blank" rel="noreferrer" className="inline-block mt-3 text-xs font-bold underline">Open file ↗</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'resources' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">📁 Resources & Documents Hub</h2>
                                
                                {/* Subject Subparts Selector */}
                                <div className="flex gap-2 overflow-x-auto pb-3 mb-6 border-b">
                                    {subjects.map((sub) => (
                                        <button 
                                            key={sub} 
                                            onClick={() => setSelectedSubject(sub)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${selectedSubject === sub ? 'bg-black text-white shadow' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                        >
                                            {sub}
                                        </button>
                                    ))}
                                </div>

                                {role === 'CR / Admin' && (
                                    <form onSubmit={handleAddResource} className="bg-gray-50 p-4 rounded-xl border mb-6">
                                        <h3 className="font-semibold mb-3 text-sm">👑 Admin Upload Portal ({selectedSubject})</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                                            <input type="text" placeholder="Title (e.g. Unit 1 Notes)" value={newResTitle} onChange={(e) => setNewResTitle(e.target.value)} className="p-2 border rounded" required />
                                            <select value={newResType} onChange={(e) => setNewResType(e.target.value)} className="p-2 border rounded">
                                                <option value="Notes">Notes</option>
                                                <option value="Books">Books</option>
                                                <option value="Roll List">Roll List</option>
                                                <option value="Question Paper">Question Paper</option>
                                            </select>
                                            <input type="text" placeholder="Drive / File Link" value={newResLink} onChange={(e) => setNewResLink(e.target.value)} className="p-2 border rounded" />
                                        </div>
                                        <button type="submit" className="bg-black text-white px-4 py-2 rounded text-sm font-medium">Upload Resource</button>
                                    </form>
                                )}

                                <div className="space-y-3">
                                    {resources.filter(r => r.subject === selectedSubject || r.subject === 'General').map((res) => (
                                        <div key={res.id} className="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm">
                                            <div>
                                                <span className="text-[10px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-bold uppercase mr-2">{res.type}</span>
                                                <span className="font-medium text-sm">{res.title}</span>
                                                <span className="text-xs text-gray-400 ml-2">({res.subject})</span>
                                            </div>
                                            <a href={res.link} target="_blank" rel="noreferrer" className="text-blue-600 font-medium text-xs underline">Open file</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'chat' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">💬 Live Chat & Discussions</h2>
                                <div className="border rounded-xl p-4 h-80 overflow-y-auto mb-4 bg-gray-50 space-y-3">
                                    {messages.map((m) => (
                                        <div key={m.id} className="p-3 bg-white border rounded-lg shadow-sm flex justify-between items-start">
                                            <div>
                                                <div className="text-xs font-bold text-gray-600">{m.user} <span className="text-[10px] font-normal text-gray-400">({m.role})</span></div>
                                                <p className="text-sm mt-1">{m.text}</p>
                                            </div>
                                            {role === 'CR / Admin' && (
                                                <button onClick={() => deleteMessage(m.id)} className="text-red-500 text-xs font-semibold hover:underline ml-2">
                                                    Revoke
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={handleSendChat} className="flex gap-2">
                                    <input type="text" value={newMsg} onChange={(e) => setNewMsg(e.target.value)} placeholder="Type a message..." className="flex-1 p-2 border rounded-lg text-sm" required />
                                    <button type="submit" className="bg-black text-white px-4 py-2 rounded-lg text-sm font-medium">Send</button>
                                </form>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around text-xs shadow-lg">
                        <button onClick={() => setActiveTab('sch')} className={`p-2 flex flex-col items-center ${activeTab === 'sch' ? 'text-black font-bold' : 'text-gray-400'}`}>
                            📅 <span>Sch</span>
                        </button>
                        <button onClick={() => setActiveTab('tasks')} className={`p-2 flex flex-col items-center ${activeTab === 'tasks' ? 'text-black font-bold' : 'text-gray-400'}`}>
                            📝 <span>Tasks</span>
                        </button>
                        <button onClick={() => setActiveTab('resources')} className={`p-2 flex flex-col items-center ${activeTab === 'resources' ? 'text-black font-bold' : 'text-gray-400'}`}>
                            📂 <span>Resources</span>
                        </button>
                        <button onClick={() => setActiveTab('chat')} className={`p-2 flex flex-col items-center ${activeTab === 'chat' ? 'text-black font-bold' : 'text-gray-400'}`}>
                            💬 <span>Chat</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
